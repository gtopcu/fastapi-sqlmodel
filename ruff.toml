# Default Ruff configuration
line-length = 88
indent-width = 4
target-version = "py314"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    "env",
    ".env",
    ".pytest_cache",
    "__pycache__",
]

[lint]
# Selected default rules: Pyflakes (F), pycodestyle errors/warnings (E, W), isort (I), bugbear (B), pyupgrade (UP)
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.flake8-bugbear]
# Allow FastAPI Dependency Injection and parameter markers in function argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
]

[lint.per-file-ignores]
# Ignore `F401` (unused imports) in all `__init__.py` files
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
