name: Deploy to AWS ECR

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY || 'fastapi-sqlmodel' }}
  SSM_PARAMETER_PATH: ${{ vars.SSM_PARAMETER_PATH || secrets.SSM_PARAMETER_PATH || '/fastapi-sqlmodel/prod/' }}

jobs:
  deploy:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch AWS parameters & generate .env file
        run: |
          echo "Retrieving parameters from AWS Systems Manager Parameter Store..."
          touch .env

          # Retrieve parameters from AWS SSM Parameter Store if configured
          if aws ssm get-parameters-by-path --path "${SSM_PARAMETER_PATH}" --with-decryption --region "${AWS_REGION}" > ssm_output.json 2>/dev/null; then
            jq -r '.Parameters[] | "\(.Name | split("/") | .[-1])=\(.Value)"' ssm_output.json >> .env
            echo "Loaded parameters from SSM Parameter Store into .env"
            rm -f ssm_output.json
          fi

          # Optional retrieval from AWS Secrets Manager if configured
          if [ -n "${{ secrets.AWS_SECRET_NAME }}" ]; then
            echo "Fetching secret from AWS Secrets Manager: ${{ secrets.AWS_SECRET_NAME }}..."
            aws secretsmanager get-secret-value \
              --secret-id "${{ secrets.AWS_SECRET_NAME }}" \
              --query SecretString \
              --output text \
              --region "${AWS_REGION}" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' >> .env
            echo "Appended secrets to .env"
          fi

          # Ensure fallback to template if .env is still empty
          if [ ! -s .env ]; then
            echo "No remote parameters retrieved. Falling back to .env.example defaults..."
            cp .env.example .env
          fi

          echo "Environment configuration successfully populated."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Successfully pushed images to ECR:"
          echo " - $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo " - $ECR_REGISTRY/$ECR_REPOSITORY:latest"
